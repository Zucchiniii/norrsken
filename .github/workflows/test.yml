name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
      - run: go vet ./...
      - run: GOOS=linux GOARCH=arm GOARM=7 go vet ./...
      - run: go test -count=1 ./...
      - name: Build the TV binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags="-s -w" -o /tmp/norrsken .
